<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API keys</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f2f7;
      --text: #1c1c1e;
      --muted: #636366;
      --line: rgba(60, 60, 67, 0.18);
      --primary: #1d9bf0;
    }
    html[data-theme="dark"] {
      --bg: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --line: rgba(255, 255, 255, 0.12);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      html[data-theme="system"] {
        --bg: #1c1c1e;
        --text: #f5f5f7;
        --muted: #98989d;
        --line: rgba(255, 255, 255, 0.12);
      }
    }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      padding: 10px 4px 12px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    p { margin: 0 0 8px; color: var(--muted); }
    label { display: block; margin: 8px 0 0; color: var(--muted); }
    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 3px 0 0;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font: inherit;
    }
    input.xfo-mask {
      -webkit-text-security: disc;
    }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button {
      flex: 1 1 auto;
      border: 0;
      border-radius: 999px;
      padding: 8px 10px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .key-private {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 450;
    }
    .key-links { margin: 8px 0 0; }
    button.quiet, button.text-link {
      flex: none;
      display: inline;
      width: auto;
      margin: 0;
      padding: 0;
      border-radius: 0;
      background: transparent;
      font-weight: 650;
    }
    button.text-link {
      color: var(--primary);
      text-decoration: underline;
    }
    button.quiet { color: var(--muted); }
    #keys-status {
      min-height: 0;
      margin: 6px 0 0;
      color: var(--text);
      font-weight: 650;
    }
    #keys-status:empty { margin: 0; }
    .key-hint {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 450;
    }
  </style>
</head>
<body>
  <form id="keys-form" autocomplete="off">
    <h1>API keys</h1>
    <p class="key-private">Stays on this Mac, only sent to X.</p>
    <label class="key-field" for="xfo-bearer">X Bearer Token
      <input id="xfo-bearer" name="bearer" class="xfo-mask" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true">
    </label>
    <p class="key-hint">From developer.x.com → your app → Keys and tokens</p>
    <div class="row">
      <button type="submit" id="save-sync">Save and Sync</button>
    </div>
    <p class="key-links"><button type="button" id="use-free" class="text-link">Use free sync instead</button></p>
    <p class="key-links"><button type="button" class="quiet" id="cancel-keys">Cancel</button></p>
    <p id="keys-status"></p>
  </form>
  <script src="../shared/x-api.js"></script>
  <script src="../shared/key-confirm.js"></script>
  <script src="keys-frame.js"></script>
</body>
</html>
